name: "Cloud Compliance: Automated Secret Scanner"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  scan-secrets:
    name: "Gitleaks Credential Scan"
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Securely checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to scan full commit history, not just the latest state

      # Step 2: Execute the open-source Gitleaks scanner
      - name: Run Gitleaks Security Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Failure triggers a pipeline break, preventing dangerous builds from running
          fail: true 

      # Step 3: Optional auditor log logging (Triggers only if secrets are clear)
      - name: Compliance Logging
        if: success()
        run: echo "🎉 Success! No exposed credentials or API keys found in this build branch."
